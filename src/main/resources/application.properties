# ========================================
# LOGGING CONFIGURATION (TEMP - VERBOSE FOR DEBUGGING STARTUP HANG)
# Revert to WARN/root=WARN + hikari=WARN once the issue is fixed.
# ========================================
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.com.vp=DEBUG
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# TEMP DEBUG: show Hikari connection attempts
