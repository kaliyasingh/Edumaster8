# ========================================
# SERVER CONFIGURATION (RENDER & PORT FIX)
# ========================================
server.port=${PORT:8080}
server.servlet.context-path=/

# ========================================
# TOMCAT & JSP PERFORMANCE OPTIMIZATION
# ========================================
server.tomcat.additional-tld-skip-patterns=*.jar,*.war
spring.main.lazy-initialization=false

# Compression Settings for Fast JSP Page Load
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# ========================================
# JSP VIEW CONFIGURATION
# ========================================
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
spring.thymeleaf.enabled=false

# ========================================
# THIRD-PARTY INTEGRATIONS (RAZORPAY & CLOUDINARY)
# ========================================
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_SzbRTIZZIUH9pw}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}
razorpay.currency=INR

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:df9afoenn}
cloudinary.api-key=${CLOUDINARY_API_KEY:262622358469544}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# ========================================
# POSTGRESQL DATABASE CONFIGURATION (AIVEN CLOUD)
# ========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://pg-1c39e555-ritikrathore73423-be07.c.aivencloud.com:13123/edumaster?sslmode=require&tcpKeepAlive=true}
spring.datasource.username=${DB_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED

# ========================================
# HIKARICP POOL OPTIMIZATION (STRICT AIVEN FIX)
# ========================================
# Safe size for Aiven free limits
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# Lower timeout so app fails fast (10s) instead of freezing user page for 30s
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=300000

spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.validation-timeout=3000

# Strict Leak Detection (15 seconds)
spring.datasource.hikari.leak-detection-threshold=15000
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.initialization-fail-timeout=5000

# ========================================
# JPA / HIBERNATE CONFIGURATION
# ========================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# 🛑 CRITICAL FIX: Disabled OSIV to prevent connection leaks!
spring.jpa.open-in-view=false

# Hibernate Batching for Performance Optimization
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Naming Strategy
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

# Timezone
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# ========================================
# EMAIL CONFIGURATION (GMAIL SMTP)
# ========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:keshavpatlawdiya@gmail.com}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.debug=false

# ========================================
# FILE UPLOAD & STATIC RESOURCES
# ========================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
spring.servlet.multipart.file-size-threshold=2KB

spring.web.resources.static-locations=classpath:/static/,classpath:/public/
file.upload-dir=/app/uploads

# ========================================
# SESSION CONFIGURATION
# ========================================
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.name=EDUMASTER_SESSION

# ========================================
# LOGGING CONFIGURATION
# ========================================
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.com.vp=DEBUG
logging.level.org.hibernate.SQL=WARN
logging.level.com.zaxxer.hikari=WARN

# ========================================
# APPLICATION METADATA & ACTUATOR
# ========================================
spring.application.name=EduMaster
application.version=1.0.0

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Jackson Settings
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.default-property-inclusion=non_null

# Error Handling
server.error.whitelabel.enabled=false
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=true

# ========================================
# DEVTOOLS
# ========================================
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false