# ========================================
# SERVER CONFIGURATION
# ========================================
server.port=${PORT:8081}
server.servlet.context-path=/

# ========================================
# JSP VIEW CONFIGURATION
# ========================================
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# Disable Thymeleaf (if dependency exists)
spring.thymeleaf.enabled=false


# Razorpay Configuration (Test Mode)
razorpay.key.id=rzp_test_SzbRTIZZIUH9pw
razorpay.key.secret=${RAZORPAY_KEY_SECRET}
razorpay.currency=INR

# ========================================
# POSTGRESQL DATABASE CONFIGURATION (AIVEN CLOUD)
# ========================================
spring.datasource.url=jdbc:postgresql://pg-1c39e555-ritikrathore73423-be07.c.aivencloud.com:13123/edumaster?sslmode=require
spring.datasource.username=avnadmin
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED

## HIKARICP CONNECTION POOL (OPTIMIZED FOR CLOUD + LOW MEMORY)
# ========================================
# Reduced pool size to save memory on free-tier hosting
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=2

# TEMP DEBUG: reduced timeout so failures surface quickly instead of hanging
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.idle-timeout=300000
spring.main.lazy-initialization=true
spring.datasource.hikari.max-lifetime=600000

# Connection validation
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.keepalive-time=30000

# Auto-reconnect settings
spring.datasource.hikari.auto-commit=true
# TEMP DEBUG: fail fast with a clear exception instead of retrying silently forever
spring.datasource.hikari.initialization-fail-timeout=10000

# ========================================
# JPA / HIBERNATE CONFIGURATION
# ========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Allows lazy-loaded entities to be accessed during JSP view rendering
spring.jpa.open-in-view=true

# Connection handling
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Naming Strategy
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

# ========================================
# EMAIL CONFIGURATION (GMAIL)
# ========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=keshavpatlawdiya@gmail.com
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
